networks:
  streaming-net:
    driver: bridge

volumes:
  redpanda-0-data:
  redpanda-1-data:
  redpanda-2-data:
  grafana-data:
  hot-keys-data:
  minio-data:
  iceberg-catalog-data:

services:
  # --- Redpanda Broker 0 ---
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --seeds
      - "redpanda-0:33145,redpanda-1:33145,redpanda-2:33145"
      - --kafka-addr
      - "plaintext://0.0.0.0:29092,external://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "plaintext://redpanda-0:29092,external://localhost:9092"
      - --rpc-addr
      - "0.0.0.0:33145"
      - --advertise-rpc-addr
      - "redpanda-0:33145"
    volumes:
      - redpanda-0-data:/var/lib/redpanda/data
    ports:
      - "9092:9092"
    networks:
      - streaming-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Redpanda Broker 1 ---
  redpanda-1:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "1"
      - --check=false
      - --seeds
      - "redpanda-0:33145,redpanda-1:33145,redpanda-2:33145"
      - --kafka-addr
      - "plaintext://0.0.0.0:29092,external://0.0.0.0:9093"
      - --advertise-kafka-addr
      - "plaintext://redpanda-1:29092,external://localhost:9093"
      - --rpc-addr
      - "0.0.0.0:33145"
      - --advertise-rpc-addr
      - "redpanda-1:33145"
    volumes:
      - redpanda-1-data:/var/lib/redpanda/data
    ports:
      - "9093:9093"
    networks:
      - streaming-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Redpanda Broker 2 ---
  redpanda-2:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-2
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "2"
      - --check=false
      - --seeds
      - "redpanda-0:33145,redpanda-1:33145,redpanda-2:33145"
      - --kafka-addr
      - "plaintext://0.0.0.0:29092,external://0.0.0.0:9094"
      - --advertise-kafka-addr
      - "plaintext://redpanda-2:29092,external://localhost:9094"
      - --rpc-addr
      - "0.0.0.0:33145"
      - --advertise-rpc-addr
      - "redpanda-2:33145"
    volumes:
      - redpanda-2-data:/var/lib/redpanda/data
    ports:
      - "9094:9094"
    networks:
      - streaming-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Topic Initialization Service ---
  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: topic-init
    networks:
      - streaming-net
    depends_on:
      redpanda-0:
        condition: service_healthy
      redpanda-1:
        condition: service_healthy
      redpanda-2:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk topic create transactions.raw --partitions 12 --replicas 3 --brokers redpanda-0:29092,redpanda-1:29092,redpanda-2:29092 || true
        rpk topic create identities.raw --partitions 12 --replicas 3 --brokers redpanda-0:29092,redpanda-1:29092,redpanda-2:29092 || true
    restart: "no"

  # --- Redpanda Console ---
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    entrypoint: ["/bin/sh", "-c", "sleep 5 && /app/console"]
    environment:
      - KAFKA_BROKERS=redpanda-0:29092,redpanda-1:29092,redpanda-2:29092
    ports:
      - "8080:8080"
    networks:
      - streaming-net
    depends_on:
      - redpanda-0
      - redpanda-1
      - redpanda-2

  # --- Data Producers ---
  payment-gateway:
    build: services/data-simulator
    command: python payment_gateway_producer.py
    environment:
      - TRANSACTIONS_PATH=/app/data/train_transaction.csv
      - KAFKA_BROKER=redpanda-0:29092,redpanda-1:29092,redpanda-2:29092
      - HOT_KEYS_PATH=/app/shared/hot_keys.json
    networks:
      - streaming-net
    volumes:
      - ./data/train_transaction.csv:/app/data/train_transaction.csv
      - ./data/hot_keys.json:/app/data/hot_keys.json
      - hot-keys-data:/app/shared
    depends_on:
      topic-init:
        condition: service_completed_successfully

  identity-risk:
    build: services/data-simulator
    command: python identity_risk_producer.py
    environment:
      - IDENTITIES_PATH=/app/data/train_identity.csv
      - TRANSACTIONS_PATH=/app/data/train_transaction.csv
      - KAFKA_BROKER=redpanda-0:29092,redpanda-1:29092,redpanda-2:29092
      - HOT_KEYS_PATH=/app/shared/hot_keys.json
    networks:
      - streaming-net
    volumes:
      - ./data/train_identity.csv:/app/data/train_identity.csv
      - ./data/train_transaction.csv:/app/data/train_transaction.csv
      - hot-keys-data:/app/shared
    depends_on:
      topic-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
    networks:
      - streaming-net

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    networks:
      - streaming-net

  hot-key-scanner:
    build:
      context: ./services/hot-key-scanner
      dockerfile: Dockerfile.hot-key-scanner
    container_name: hot-key-scanner
    profiles: ["tools"]
    environment:
      KAFKA_BROKER: redpanda-0:29092,redpanda-1:29092,redpanda-2:29092
      HOT_KEYS_PATH: /app/shared/hot_keys.json
      HEAVY_THRESHOLD: "0.02"
      SAMPLE_SIZE: "50000"
    volumes:
      - hot-keys-data:/app/shared
    networks:
      - streaming-net  
    stdin_open: true
    tty: true
    depends_on:
      - redpanda-0
      - redpanda-1
      - redpanda-2


  # --- MinIO (Iceberg's object storage) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes:
      - minio-data:/data
    networks:
      - streaming-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- MinIO bucket init (creates the bucket Iceberg writes to) ---
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 admin password
        mc mb local/iceberg-warehouse || true
        exit 0
    networks:
      - streaming-net
    depends_on:
      minio:
        condition: service_healthy

  # --- Iceberg REST Catalog ---
  iceberg-catalog:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-catalog
    environment:
      - CATALOG_WAREHOUSE=s3://iceberg-warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - "8181:8181"
    volumes:
      - iceberg-catalog-data:/data
    networks:
      - streaming-net
    depends_on:
      - minio-init